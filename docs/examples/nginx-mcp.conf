# 反向代理 MCP 服务的 Nginx 配置示例：TLS、限流、流式响应不缓冲。
# MCP 进程监听 127.0.0.1:8787（默认值）。把 mcp.example.com 和证书路径换成你的。

# 限流区要写在 http { } 这一层（放在 conf.d 下的文件里时，这里就是 http 层）。
# 每个来源地址每秒 10 个请求；10m 的共享内存大约能记 16 万个地址。
limit_req_zone  $binary_remote_addr zone=gdl_mcp_req:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=gdl_mcp_conn:10m;

upstream gdl_mcp {
    server 127.0.0.1:8787;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name mcp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # Nginx 1.25.1 之前的版本请改成在 listen 行末尾加 http2
    server_name mcp.example.com;

    ssl_certificate     /etc/ssl/mcp.example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/mcp.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 请求体上限，和服务自身的 1 MB 上限一致
    client_max_body_size 1m;

    # MCP 端点
    location = /mcp {
        limit_req  zone=gdl_mcp_req burst=20 nodelay;
        limit_conn gdl_mcp_conn 20;
        limit_req_status 429;

        proxy_pass http://gdl_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 流式响应（SSE）不缓冲、不缓存、不压缩，收到多少转发多少
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;

        proxy_connect_timeout 5s;
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;
    }

    # 健康检查
    location = /health {
        proxy_pass http://gdl_mcp;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        access_log off;
    }

    # 其余地址一律不转发
    location / {
        return 404;
    }
}

