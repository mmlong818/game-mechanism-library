# 静态网站的 Nginx 配置示例。把 example.com、证书路径、站点目录换成你的。
# 站点目录里放的是包里 site/ 目录的全部内容（index.html 在这一层）。

server {
    listen 80;
    listen [::]:80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;                      # Nginx 1.25.1 之前的版本请改成在 listen 行末尾加 http2
    server_name example.com;

    ssl_certificate     /etc/ssl/example.com/fullchain.pem;
    ssl_certificate_key /etc/ssl/example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    charset utf-8;
    gzip on;
    gzip_types application/json text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # ---------- 写法一：部署在域名根目录 https://example.com/ ----------
    root /var/www/game-design-library;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # 这三个文件是“指针”、配置和入口，改了要马上生效，不要让浏览器和 CDN 长时间缓存
    location = /data/current.json { add_header Cache-Control "no-cache" always; }
    location = /site-config.json  { add_header Cache-Control "no-cache" always; }
    location = /index.html        { add_header Cache-Control "no-cache" always; }

    # 文件名带内容哈希的脚本和样式、发布后不再变的发布包、封面图，可以长期缓存
    location /assets/       { add_header Cache-Control "public, max-age=31536000, immutable" always; }
    location /data/release/ { add_header Cache-Control "public, max-age=86400" always; }
    location /covers/       { add_header Cache-Control "public, max-age=86400" always; }

    # MCP 服务如果在别的机器上、并且用 GDL_SITE_URL 读这里的数据，不需要额外设置：
    # 那是服务器之间的普通 HTTP 请求，不涉及跨域。

    # ---------- 写法二：部署在子路径 https://example.com/tools/library/ ----------
    # 把上面“写法一”的 root、index 和各个 location 去掉，改用下面这一组。
    # 站点文件放在 /var/www/game-design-library，对外的路径是 /tools/library/。
    #
    # location = /tools/library { return 301 /tools/library/; }
    # location /tools/library/ {
    #     alias /var/www/game-design-library/;
    #     index index.html;
    # }
    # location = /tools/library/data/current.json {
    #     alias /var/www/game-design-library/data/current.json;
    #     add_header Cache-Control "no-cache" always;
    # }
    # location = /tools/library/site-config.json {
    #     alias /var/www/game-design-library/site-config.json;
    #     add_header Cache-Control "no-cache" always;
    # }
}
