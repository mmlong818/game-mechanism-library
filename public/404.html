<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>游戏设计资料库</title>
    <script>
      // 旧地址统一回到首页。GitHub Pages 项目站点的根是第一段路径。
      var seg = location.pathname.split("/").filter(Boolean)[0];
      var root = /\.github\.io$/.test(location.hostname) && seg ? "/" + seg + "/" : "/";
      location.replace(root);
    </script>
  </head>
  <body>
    <p>这个地址已经不在了。<a href="./">回到游戏设计资料库首页</a></p>
  </body>
</html>
